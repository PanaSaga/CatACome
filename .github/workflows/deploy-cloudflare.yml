name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      # cf-bootstrap이 만든 database_id 커밋도 이 브랜치들로 들어오므로 그 푸시로도
      # 재배포가 걸린다 — 별도로 다시 누를 필요가 없다.
      - claude/repo-permissions-check-1q7bu2
      - main
      - claude/github-pages-game-mpy8g1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 정적 자산 스테이징
        # 빌드 단계 없는 순수 ES 모듈 정적 사이트. wrangler.toml·migrations·functions는
        # public/ 밖에 남겨서 배포되는 정적 자산에 스키마·설정이 섞여 들어가지 않게 한다.
        # functions/는 배포 대상 디렉터리가 아니라 저장소 루트를 기준으로 자동 인식된다.
        run: |
          mkdir -p public
          cp index.html styles.css public/
          cp -R src public/
          echo "--- 배포 대상 ---"
          find public -type f | sort

      - name: D1 마이그레이션 적용
        # 각 파일이 CREATE TABLE/INDEX IF NOT EXISTS라 순서대로 다시 실행해도 안전하다.
        run: |
          npx wrangler d1 execute catacome --remote --file=migrations/0001_init.sql
          npx wrangler d1 execute catacome --remote --file=migrations/0002_corpses.sql

      - name: Pages 배포
        run: npx wrangler pages deploy public --project-name=catacome --branch="${GITHUB_REF_NAME}" --commit-dirty=true
