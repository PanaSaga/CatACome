name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      # github-pages 환경 보호 규칙이 기본 브랜치에서만 배포를 허용한다.
      # 다른 브랜치에서 밀면 러너 배정 전에 거부되므로(스텝 0개 즉시 실패)
      # 실제 배포는 기본 브랜치 푸시로만 일어난다.
      - claude/repo-permissions-check-1q7bu2
      - main
      - claude/github-pages-game-mpy8g1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        # 빌드 단계가 없는 순수 ES 모듈 정적 사이트다. 게임 파일만 골라 담는다.
        run: |
          mkdir -p dist
          cp index.html styles.css dist/
          cp -R src dist/
          touch dist/.nojekyll
          echo "--- 배포 대상 ---"
          find dist -type f | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
