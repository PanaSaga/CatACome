<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CAT A COME — 굴착 · 고양이 구출</title>
<meta name="description" content="지상에서 시작해 사망으로 끝나는 로그라이트 굴착 게임. 지금 올라가서 맡길 것인가, 조금만 더 팔 것인가." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2213%22>🐈</text></svg>" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="hud-tl">
    <div id="hp" class="hearts"></div>
    <div id="breath" class="bar" hidden><i></i><span>숨</span></div>
    <div id="buffs"></div>
  </div>
  <div class="hud-tr">
    <div id="depth" class="depth">0 m</div>
    <div id="best" class="sub">최고 0 m</div>
    <div id="copper" class="money">0구리</div>
    <div id="bank" class="sub">예치 0</div>
    <div id="cats" class="sub">🐈 0 / 2</div>
  </div>
  <div class="hud-bl">
    <div id="sonar" class="sonar">소나 Lv1 <b>준비</b></div>
    <div id="grapple" class="sub">갈고리 Lv1 · 8타일 (Shift/우클릭)</div>
  </div>
  <div class="hud-br">
    <div class="keyhelp">
      WASD 이동 · Space 점프 · 좌클릭 사용 · Shift/우클릭 갈고리<br />
      R 소나 · E 상호작용 · Tab 인벤토리 · 휠·1~6 슬롯 · Esc 닫기
    </div>
  </div>
  <div id="hotbar" class="hotbar"></div>
  <div id="depthscale" class="depthscale"></div>
</div>

<div id="hint" class="hint" hidden></div>
<div id="toasts" class="toasts"></div>
<div id="modal" class="modal" hidden></div>

<div id="start" class="overlay">
  <div class="panel start-panel">
    <h1>CAT A COME</h1>
    <p class="tagline">지상에서 시작해 사망으로 끝난다. 남는 것은 업그레이드와 은행 예치금뿐.</p>
    <label>플레이어 이름 <span class="dim">(8자 이하)</span>
      <input id="nameInput" maxlength="8" placeholder="예: 굴착왕" />
    </label>
    <div id="nameErr" class="err"></div>
    <button id="startBtn" class="primary">내려가기</button>
    <button id="boardBtn" class="ghost">랭킹 보기</button>
    <div class="backend-note" id="backendNote"></div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
